# Nightly checks of the Rust build. None of these jobs gates a merge (#22, #15, ADR 0002).
#
#   mutants      full `cargo mutants`, sharded, each crate on a runner of its own OS
#   kill-matrix  which spec test kills which mutant, from the mutants jobs' mutants.out
#   fuzz         `cargo bolero test` on every bolero harness, on a separately pinned nightly
#   model        the 3-machine stateright model of ownership and handover
#   bench        `divan` microbenchmarks, for trends only
#
# This file lives on `main` because GitHub runs `schedule:` only from the default branch, but it
# tests NIGHTLY_REF below. Until that branch holds what a job runs (the branch itself, the Cargo
# workspace, a fuzz harness, the model, a bench), the `probe` job says so in the run summary and
# the job is skipped, so the run stays green.
#
# Results are uploaded as artifacts for the nightly triage routine (#44):
#   mutants-<os>-shard-<k>   mutants.out (missed.txt, caught.txt, outcomes.json, diff/)
#   fuzz-crashes             bolero crash inputs (only when a target crashed)
#   fuzz-corpus              corpus entries after the run, to propose as a PR
#   model-failures           the model's output, with its counterexample (only on failure)
#   divan                    benchmark output
# Find them with:
#   gh run list -R FredeAlexandre/beamer -w nightly.yml -L 1 --json databaseId,headSha,conclusion
#   gh run download <run id> -R FredeAlexandre/beamer -p 'mutants-*'

name: Nightly

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC, every day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # ┌──────────────────────────────────────────────────────────────────────────────────────┐
  # │ The branch the nightly tests. Change `rust` to `main` when the `rust` PR lands (#24). │
  # └──────────────────────────────────────────────────────────────────────────────────────┘
  NIGHTLY_REF: rust

  # The nightly toolchain for `cargo bolero test` only. The build itself uses the stable
  # channel pinned in `rust-toolchain.toml`. Move this pin by hand, on its own.
  FUZZ_TOOLCHAIN: nightly-2026-11-01

  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: What exists on the branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.branch.outputs.sha }}
      workspace: ${{ steps.scan.outputs.workspace }}
      mutants_matrix: ${{ steps.scan.outputs.mutants_matrix }}
      fuzz: ${{ steps.scan.outputs.fuzz }}
      model_packages: ${{ steps.scan.outputs.model_packages }}
      bench_packages: ${{ steps.scan.outputs.bench_packages }}
    steps:
      - name: Find ${{ env.NIGHTLY_REF }}
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$NIGHTLY_REF" --jq .commit.sha 2>/dev/null); then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "Testing \`$NIGHTLY_REF\` at \`$sha\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Branch $NIGHTLY_REF does not exist yet; every job is skipped."
            echo "Branch \`$NIGHTLY_REF\` does not exist yet: every job is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out ${{ env.NIGHTLY_REF }}
        if: steps.branch.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.sha }}
          persist-credentials: false

      - name: Scan the workspace
        id: scan
        if: steps.branch.outputs.sha != ''
        env:
          # Shards per OS. Tune once the mutant count is known: at least ~10 mutants per shard.
          SHARDS_LINUX: 8
          SHARDS_MAC: 4
          SHARDS_WIN: 4
        run: |
          say() { echo "- $1" >> "$GITHUB_STEP_SUMMARY"; }

          if ! grep -qs '^\[workspace\]' Cargo.toml; then
            echo "workspace=false" >> "$GITHUB_OUTPUT"
            say "No Cargo workspace yet: every job is skipped."
            exit 0
          fi
          echo "workspace=true" >> "$GITHUB_OUTPUT"

          # Crates live flat in crates/, directory name = crate name (#28).
          crates=$(for f in crates/*/Cargo.toml; do
                     if [ -e "$f" ]; then basename "$(dirname "$f")"; fi
                   done | sort)

          # Mutants, per OS (#22, #33). The platform crates are mutated on their own OS, because
          # cargo-mutants doesn't understand #[cfg(target_os)]. The -ffi shims and beamer-ui are
          # never mutated (one crate-level justification each), nor are the vendored -sys bindings.
          # Everything else is OS-independent and runs on Linux. If a crate turns out not to build
          # on Linux, move it to the mac and win lists.
          linux=$(echo "$crates" | grep -Ev '^(beamer-(mac|win)(-ffi)?|beamer-ui|.*-sys)$' || true)
          mac=$(echo "$crates" | grep -Ex 'beamer-mac' || true)
          win=$(echo "$crates" | grep -Ex 'beamer-win' || true)
          entries() { # name runner shards crates...
            local name=$1 runner=$2 shards=$3; shift 3
            [ $# -gt 0 ] || return 0
            local pkgs; pkgs=$(printf -- '-p %s ' "$@")
            for ((k = 0; k < shards; k++)); do
              jq -nc --arg n "$name" --arg r "$runner" --arg p "$pkgs" --argjson k "$k" --argjson s "$shards" \
                '{name: $n, runner: $r, packages: $p, shard: $k, shards: $s}'
            done
          }
          # shellcheck disable=SC2086 # word splitting of the crate lists is intended
          matrix=$( { entries linux ubuntu-latest "$SHARDS_LINUX" $linux
                      entries mac macos-latest "$SHARDS_MAC" $mac
                      entries win windows-latest "$SHARDS_WIN" $win; } | jq -sc .)
          echo "mutants_matrix=$matrix" >> "$GITHUB_OUTPUT"
          say "Mutants on Linux: $(echo "${linux:-none}" | paste -sd ' ' -)"
          say "Mutants on macOS: ${mac:-none}"
          say "Mutants on Windows: ${win:-none}"

          # Fuzzing: any bolero harness in the crates (#15).
          if grep -rqs --include='*.rs' 'bolero::check!' crates; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"; say "Bolero harnesses found."
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"; say "No bolero harness yet: fuzz is skipped."
          fi

          # The stateright model and the divan benches: the crates that depend on them.
          deps_on() {
            grep -lEs "^[[:space:]]*$1([.][a-z]+)?[[:space:]]*=" crates/*/Cargo.toml \
              | xargs -r -n1 dirname | xargs -r -n1 basename | tr '\n' ' ' | sed 's/ $//' || true
          }
          model=$(deps_on stateright); bench=$(deps_on divan)
          echo "model_packages=$model" >> "$GITHUB_OUTPUT"
          echo "bench_packages=$bench" >> "$GITHUB_OUTPUT"
          say "Stateright model in: ${model:-none (model is skipped)}"
          say "Divan benches in: ${bench:-none (bench is skipped)}"

  mutants:
    name: Mutants ${{ matrix.name }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: probe
    if: needs.probe.outputs.workspace == 'true' && needs.probe.outputs.mutants_matrix != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.probe.outputs.mutants_matrix || '[]') }}
    env:
      # Fixed seeds, so a random test gives the same verdict on every mutant (#15).
      PROPTEST_RNG_SEED: "20261116"
      PROPTEST_CASES: "256"
      BOLERO_RANDOM_SEED: "20261116"
      BOLERO_RANDOM_ITERATIONS: "1000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.probe.outputs.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-mutants-${{ matrix.name }}
          save-if: ${{ matrix.shard == 0 }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27,cargo-nextest
      - name: cargo mutants
        # Only the black-box spec tests in each crate's tests/ count (ADR 0002): nextest's
        # kind(test) is the integration-test binaries. When #33 writes .cargo/mutants.toml, move
        # this filter there so the merge gate and the nightly count the same tests.
        # Exit 2 (missed mutants) and 3 (timeouts) are findings for triage, not a failed job.
        # --no-fail-fast runs every test against each mutant, so its log names every test that
        # kills it: the kill matrix reads that (`cargo xtask kill-matrix`). It stays here, not in
        # .cargo/mutants.toml: the merge gate needs only one killer and stops at the first.
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          set +e
          # shellcheck disable=SC2086 # PACKAGES is a list of -p flags
          cargo mutants --no-shuffle --test-tool=nextest \
            --shard "${{ matrix.shard }}/${{ matrix.shards }}" $PACKAGES \
            -- -E 'kind(test)' --no-fail-fast
          code=$?
          case $code in
            0) echo "All mutants caught." ;;
            2|3) echo "::warning::Missed or timed-out mutants (exit $code); see mutants.out." ;;
            *) exit $code ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ matrix.name }}-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
          retention-days: 30

  kill-matrix:
    name: Kill matrix
    needs: [probe, mutants]
    # Also after a failed shard: the other shards' matrix is still worth reading.
    if: ${{ !cancelled() && needs.probe.outputs.workspace == 'true' && needs.probe.outputs.mutants_matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The kill matrix lists which spec tests kill which mutants, so a test that kills none is
      # deleted or justified (#15). cargo-mutants knows one killer per mutant at most; the mutants
      # job's --no-fail-fast makes each mutant's log name all of them, and `cargo xtask
      # kill-matrix` reads those logs from every shard's mutants.out (#31).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.probe.outputs.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-kill-matrix
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-*
          path: mutants
      - name: cargo xtask kill-matrix
        run: |
          runs=()
          for dir in mutants/*/; do
            if [ -f "$dir/outcomes.json" ]; then runs+=("$dir"); fi
          done
          if [ ${#runs[@]} -eq 0 ]; then
            echo "::warning::No shard left a mutants.out; no kill matrix."
            exit 0
          fi
          cargo xtask kill-matrix "${runs[@]}" > kill-matrix.md
          # The summary takes the counts, the idle tests and the survivors; the artifact has all.
          sed '/^## Mutants each spec test kills/,$d' kill-matrix.md | head -c 900000 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kill-matrix
          path: kill-matrix.md
          if-no-files-found: ignore
          retention-days: 30

  fuzz:
    name: Fuzz (bolero)
    needs: probe
    if: needs.probe.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SECONDS_PER_TARGET: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.probe.outputs.sha }}
          persist-credentials: false
      - name: Install the pinned nightly
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --component rust-src,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bolero@0.13
      - name: cargo bolero test, every target
        # `cargo bolero list` prints one JSON object per harness ({"package", "test"}); check
        # that format when the first harness lands. If the loop outgrows the timeout, turn the
        # targets into a matrix.
        run: |
          cargo "+$FUZZ_TOOLCHAIN" bolero list > targets.jsonl
          failed=0
          while read -r pkg test; do
            echo "::group::$pkg $test"
            if ! cargo "+$FUZZ_TOOLCHAIN" bolero test -p "$pkg" "$test" \
                 --engine libfuzzer -T "${SECONDS_PER_TARGET}s"; then
              echo "::error::Fuzz target $pkg $test failed"
              failed=1
            fi
            echo "::endgroup::"
          done < <(jq -r '"\(.package) \(.test)"' targets.jsonl)
          exit $failed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: "**/__fuzz__/*/crashes/"
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-corpus
          path: "**/__fuzz__/*/corpus/"
          if-no-files-found: ignore
          retention-days: 14

  model:
    name: Model (stateright, 3 machines)
    needs: probe
    if: needs.probe.outputs.model_packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.probe.outputs.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-model
      - name: Check the model
        # No ticket defines the model's entry point yet. This assumes it is an #[ignore]d test
        # (so the merge gates skip it) in the crate that depends on stateright, and runs all of
        # that crate's tests. Narrow it to the model's test once it exists.
        env:
          PACKAGES: ${{ needs.probe.outputs.model_packages }}
        run: |
          mkdir -p model-out
          failed=0
          for pkg in $PACKAGES; do
            cargo test --release -p "$pkg" -- --include-ignored 2>&1 | tee "model-out/$pkg.log" \
              || failed=1
          done
          exit $failed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: model-failures
          path: model-out/
          if-no-files-found: ignore
          retention-days: 30

  bench:
    name: Bench (divan trends)
    needs: probe
    if: needs.probe.outputs.bench_packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.probe.outputs.sha }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-bench
      - name: cargo bench
        # Trends only, never a gate (#15): hosted runners are too noisy for budgets. The output
        # goes to the run summary and an artifact; there is no trend store beyond the artifacts.
        env:
          PACKAGES: ${{ needs.probe.outputs.bench_packages }}
        run: |
          mkdir -p divan
          for pkg in $PACKAGES; do
            cargo bench -p "$pkg" 2>&1 | tee "divan/$pkg.txt"
            { echo "### $pkg"; echo '```'; cat "divan/$pkg.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: divan
          path: divan/
          if-no-files-found: ignore
          retention-days: 90
