# The merge gates of the Rust build (#22, #33, ADR 0002): every task PR into `rust` passes them.
#
#   fmt       rustfmt, once
#   checks    xtask deps, test-audit, tracey validate and stale, red-first
#   test      clippy -D warnings and nextest, on each runner
#   mutants   cargo mutants --in-diff, each crate on the runner of its OS
#
# Which crates each runner covers is `cargo xtask crates`, read from the dependency table: Linux
# takes the OS-independent crates, macOS and Windows the whole workspace. The nightly
# (nightly.yml) asks the same command, so both mutate each crate on the same runner.
#
# CI publishes no app artifacts: it can't sign as "Beamer Dev" (#22).

name: CI

on:
  pull_request:
    branches: [rust]
  # Runs on `rust` save the caches every PR restores; PR runs only read them.
  push:
    branches: [rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A PR is tested at its head, not at GitHub's merge commit: test-audit reads each commit, and a
  # merge commit touching tests and code together would fail it.
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install # reads rust-toolchain.toml
      - run: cargo fmt --all --check

  checks:
    name: xtask checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          # test-audit and red-first read the history since the base.
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the base and the Python tag
        # test-audit checks the Python ledger against archive/python (#31). Until #50 tags it,
        # there is no ledger to check either.
        run: |
          git fetch --no-tags origin +refs/heads/rust:refs/remotes/origin/rust
          if git ls-remote --exit-code --tags origin refs/tags/archive/python > /dev/null; then
            git fetch --no-tags origin +refs/tags/archive/python:refs/tags/archive/python
          else
            echo "::notice::No archive/python tag yet (#50); test-audit has no ledger to check against it."
          fi
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          save-if: ${{ github.ref == 'refs/heads/rust' }}
      - uses: ./.github/actions/tracey
      - name: cargo xtask deps
        run: cargo xtask deps
      - name: cargo xtask test-audit
        run: cargo xtask test-audit --since "$(git merge-base origin/rust HEAD)"
      - name: tracey query validate
        run: cargo xtask spec validate
      - name: tracey query stale
        run: cargo xtask spec stale
      - name: cargo xtask red-first
        run: cargo xtask red-first --base origin/rust

  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: linux, os: ubuntu-latest }
          - { runner: macos, os: macos-latest }
          # tracey has no Windows release, and its source build needs a node its build script
          # doesn't find on the runner. The spec tests that run it (xtask's `spec` binary) run on
          # Linux and macOS; tracey's own gates run in `checks`.
          - { runner: windows, os: windows-latest, nextest: "-E 'not binary_id(xtask::spec)'" }
    steps:
      - name: Keep line endings as committed
        # Windows runners default to core.autocrlf=true; xtask's tests compare files byte for byte.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          # xtask's test of this repo's own test-audit reads every commit; a shallow clone's one
          # grafted commit would touch tests and code together.
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/rust' }}
      - uses: taiki-e/install-action@v2
        with:
          # xtask's own tests run both, and tracey below.
          tool: cargo-nextest@0.9.152,cargo-mutants@27.1.0
      - uses: ./.github/actions/tracey
        if: runner.os != 'Windows'
      - name: Which crates
        id: crates
        run: echo "args=$(cargo xtask crates --runner ${{ matrix.runner }} --for test)" >> "$GITHUB_OUTPUT"
      - name: clippy -D warnings
        # Each sans-I/O crate's clippy.toml holds its disallowed-* lists; clippy reads it itself.
        run: cargo clippy ${{ steps.crates.outputs.args }} --all-targets --locked -- -D warnings
      - name: nextest
        # A spec test merged red, panicking at a todo!(), is pending, not failed (#23).
        run: cargo xtask nextest --runner ${{ matrix.runner }} -- --locked ${{ matrix.nextest }}

  mutants:
    name: mutants (${{ matrix.runner }})
    # The diff of a PR; a push to rust has none.
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: linux, os: ubuntu-latest }
          - { runner: macos, os: macos-latest }
          - { runner: windows, os: windows-latest }
    env:
      # Fixed seeds, so a random test gives the same verdict on every mutant (#15). The nightly
      # sets the same.
      PROPTEST_RNG_SEED: "20261116"
      PROPTEST_CASES: "256"
      BOLERO_RANDOM_SEED: "20261116"
      BOLERO_RANDOM_ITERATIONS: "1000"
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the base
        run: git fetch --no-tags origin +refs/heads/rust:refs/remotes/origin/rust
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/rust' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152,cargo-mutants@27.1.0
      - name: cargo mutants --in-diff
        # Only the code this PR changes, in the crates this runner mutates, against tests/ only
        # (.cargo/mutants.toml): those of every crate that reaches the mutant, so a rule tested
        # from beamer-sim counts (#135). Any missed or timed-out mutant fails the gate.
        run: cargo xtask mutants --runner ${{ matrix.runner }} --in-diff origin/rust
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mutants-${{ matrix.runner }}
          path: mutants.out
          if-no-files-found: ignore
          retention-days: 14
