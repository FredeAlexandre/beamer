[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
# `blind` rewrites function bodies by their byte ranges, which proc-macro2 only gives with
# span-locations.
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
