# PROTOTYPE: Rust UI toolkit bake-off, Slint slice (throwaway, never merged).
[package]
name = "bakeoff-slint"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[[bin]]
name = "bakeoff-slint"
path = "src/main.rs"

[dependencies]
# Skia renderer (Metal on macOS, Direct3D 12 on Windows); see NOTES.md for why not FemtoVG/software.
slint = { version = "=1.19.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-skia",
    "accessibility",
    "system-tray",
    "unstable-winit-030",
    # Without this the Skia-over-wgpu surface never calls rendering notifiers (see NOTES.md).
    "unstable-wgpu-30",
] }
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
libc = "=0.2.191"
objc2-foundation = { version = "=0.3.2", features = ["NSGeometry", "NSString", "NSArray", "NSDictionary", "NSValue"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSWindow", "NSView", "NSResponder", "NSScreen", "NSApplication", "NSRunningApplication", "NSGraphics"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_UI_Shell"] }

[build-dependencies]
slint-build = "=1.19.0"

[profile.release]
strip = true
